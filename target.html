        // Set selectors to saved values (if any)
        if (savedtarget) targetSelect.value = savedtarget;
        if (savedlevel) levelSelect.value = savedlevel;

        function showTarget(target, level) {
          if (!target || !level) {
            displayDiv.innerHTML = "<p>Please select the target & level of the target you wish to open.</p>";
            return;
          }

          const key = `${target}-${level}`;
          if (targets[key]) {
            displayDiv.innerHTML = targets[key].map(section => `
            <table>
                <tr><th colspan="3"><label>${section.title}<input type="checkbox" class="section-toggle" data-section="${section.id}"/></label></th></tr>
                ${section.details.map(detail => `<tr data-section="${section.id}"><td colspan="3">${detail}</td></tr>`).join('')}
                <tr><td colspan="3" style="height: 40px;"></td></tr>
            </table>
            `).join('');

            // Add notes section after target table
            const notesKey = `notes-${key}`;
            const savedNote = localStorage.getItem(notesKey) || "";

            const notesHTML = `
              <div style="margin-top: 20px;">
                <label for="notes">Notes:</label>
                <textarea id="notes" rows="4" style="width: 100%;">${savedNote}</textarea>
              </div>
            `;

            displayDiv.innerHTML += notesHTML;

            // Restore saved checkbox states and faded rows
            const savedCheckboxes = JSON.parse(localStorage.getItem(`checkboxes-${key}`)) || {};
            for (const sectionId in savedCheckboxes) {
              const checkbox = displayDiv.querySelector(`.section-toggle[data-section="${sectionId}"]`);
              const rows = displayDiv.querySelectorAll(`tr[data-section="${sectionId}"]`);
              if (checkbox) {
                checkbox.checked = savedCheckboxes[sectionId];
                rows.forEach(row => {
                  row.classList.toggle("faded", checkbox.checked);
                });
              }
            }

            // Add event listeners for checkboxes
            const checkboxes = displayDiv.querySelectorAll(".section-toggle");
            checkboxes.forEach((checkbox) => {
              checkbox.addEventListener("change", () => {
                const sectionId = checkbox.dataset.section;
                const rows = displayDiv.querySelectorAll(`tr[data-section="${sectionId}"]`);

                rows.forEach((row) => {
                  row.classList.toggle("faded", checkbox.checked);
                });

                const savedCheckboxes = JSON.parse(localStorage.getItem(`checkboxes-${key}`)) || {};
                savedCheckboxes[sectionId] = checkbox.checked;
                localStorage.setItem(`checkboxes-${key}`, JSON.stringify(savedCheckboxes));
              });
            });

            // Add event listener to notes textarea (once)
            const notesInput = document.getElementById("notes");
            if (notesInput) {
              notesInput.addEventListener("input", () => {
                localStorage.setItem(notesKey, notesInput.value);
              });
            }

          } else {
            displayDiv.innerHTML = "<p>No target available for this target/level yet.</p>";
          }
        }

        // Show target on load based on saved or default values
        showTarget(targetSelect.value, levelSelect.value);

        // Save and update target on selector change
        targetSelect.addEventListener("change", () => {
          localStorage.setItem("selectedtarget", targetSelect.value);
          showTarget(targetSelect.value, levelSelect.value);
        });

        levelSelect.addEventListener("change", () => {
          localStorage.setItem("selectedlevel", levelSelect.value);
          showTarget(targetSelect.value, levelSelect.value);
        });
